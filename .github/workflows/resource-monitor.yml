name: External resource monitor

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check resources
        id: check
        continue-on-error: true
        run: |
          node dist/cli.js \
            --input examples/resources.json \
            --config examples/monitor.yml \
            --output resource-report.json \
            --markdown-output resource-report.md
      - name: Upload monitor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-resource-monitor-report
          path: |
            resource-report.json
            resource-report.md
          if-no-files-found: error
      - name: Apply monitor exit status
        if: steps.check.outcome == 'failure'
        run: exit 1
